<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Food Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../style.css">
</head>
<body>
    <div class="container">
        <form class="register-form" id="registerform">
            <h1>Food Store</h1>
            <h2>Registro de usuario</h2>

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Tu apellido" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="micorreo@mail.com" required>

            <label for="celular">Celular:</label>
            <input type="tel" id="celular" name="celular" placeholder="11 1234 5678" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>

            <button type="submit">REGISTRARSE</button>

            <p class="registro">¿Ya tenés cuenta? <a href="../login/login.html">Iniciar sesión</a></p>
        </form>
    </div>
    <script type="module" src="./registro.ts"></script>
</body>
</html>
