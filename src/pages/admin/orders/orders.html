<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Pedidos - Food Store</title>
  <link rel="stylesheet" href="../../../style.css">
</head>
<body>
  <header>
    <h1>Food Store - Administración</h1>
    <div class="header-actions">
      <button id="logoutButton" class="btn-logout">Cerrar sesión</button>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <nav>
        <ul>
          <li><a href="../home/home.html">📊 Dashboard</a></li>
          <li><a href="../products/products.html">📦 Productos</a></li>
          <li><a href="../categories/categories.html">📂 Categorías</a></li>
          <li><a href="#" class="active">📋 Pedidos</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header-actions">
        <h2>Gestión de Pedidos</h2>
        <div>
          <label for="filtroEstado">Filtrar por estado:</label>
          <select id="filtroEstado">
            <option value="todos">Todos</option>
            <option value="PENDIENTE">Pendiente</option>
            <option value="CONFIRMADO">Confirmado</option>
            <option value="EN_PREPARACION">En preparación</option>
            <option value="TERMINADO">Terminado</option>
            <option value="CANCELADO">Cancelado</option>
          </select>
        </div>
      </div>

      <div id="ordersContainer" class="orders-list"></div>
    </main>
  </div>

  <!-- Modal detalle pedido -->
  <div id="modalDetallePedido" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2>Pedido #<span id="detalleId"></span></h2>
      <p><strong>Cliente:</strong> <span id="detalleCliente"></span></p>
      <p><strong>Fecha:</strong> <span id="detalleFecha"></span></p>
      <p><strong>Estado:</strong> 
        <select id="detalleEstado">
          <option value="PENDIENTE">Pendiente</option>
          <option value="CONFIRMADO">Confirmado</option>
          <option value="EN_PREPARACION">En preparación</option>
          <option value="TERMINADO">Terminado</option>
          <option value="CANCELADO">Cancelado</option>
        </select>
        <button id="btnCambiarEstado" class="btn-primary">Actualizar estado</button>
      </p>
      <p><strong>Forma de pago:</strong> <span id="detallePago"></span></p>
      <p><strong>Total:</strong> $<span id="detalleTotal"></span></p>
      <hr>
      <h3>Productos</h3>
      <ul id="detalleProductos" class="modal-productos-list"></ul>
      <p><strong>Subtotal:</strong> $<span id="detalleSubtotal"></span></p>
      <p><strong>Envío:</strong> $<span id="detalleEnvio"></span></p>
    </div>
  </div>

  <footer>
    <p>©2026 Foodie Company - Panel de Administración</p>
  </footer>

  <script type="module" src="./orders.ts"></script>
</body>
</html>
