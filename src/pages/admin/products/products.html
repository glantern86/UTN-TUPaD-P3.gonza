<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos - Food Store</title>
  <link rel="stylesheet" href="../../../style.css">
</head>
<body>
  <header>
    <h1>Food Store - Administración</h1>
    <div class="header-actions">
      <button id="logoutButton" class="btn-logout">Cerrar sesión</button>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <nav>
        <ul>
          <li><a href="../home/home.html">📊 Dashboard</a></li>
          <li><a href="#" class="active">📦 Productos</a></li>
          <li><a href="../categories/categories.html">📂 Categorías</a></li>
          <li><a href="../orders/orders.html">📋 Pedidos</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header-actions">
        <h2>Gestión de Productos</h2>
        <button id="btnNuevoProducto" class="btn-primary">+ Nuevo Producto</button>
      </div>

      <table class="admin-table" id="tablaProductos">
        <thead>
          <tr>
            <th>ID</th>
            <th>Imagen</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Categoría</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="productosBody"></tbody>
      </table>
    </main>
  </div>

  <!-- Modal producto -->
  <div id="modalProducto" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2 id="modalProductoTitle">Nuevo Producto</h2>
      <form id="formProducto">
        <input type="hidden" id="productoId">
        <label>Nombre *</label>
        <input type="text" id="prodNombre" required>
        <label>Descripción *</label>
        <textarea id="prodDescripcion" rows="3" required></textarea>
        <label>Precio *</label>
        <input type="number" id="prodPrecio" min="0" step="0.01" required>
        <label>Stock *</label>
        <input type="number" id="prodStock" min="0" required>
        <label>Categoría *</label>
        <select id="prodCategoria" required></select>
        <label>Imagen (URL)</label>
        <input type="text" id="prodImagen" placeholder="https://ejemplo.com/imagen.jpg">
        <label>
          <input type="checkbox" id="prodDisponible" checked> Disponible
        </label>
        <button type="submit" class="btn-primary">Guardar</button>
      </form>
    </div>
  </div>

  <footer>
    <p>©2026 Foodie Company - Panel de Administración</p>
  </footer>

  <script type="module" src="./products.ts"></script>
</body>
</html>
